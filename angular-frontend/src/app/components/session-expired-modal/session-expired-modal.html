<div class="modal-backdrop show"></div>
<div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="session-expired-title"
     [appBackdropClose]="dialog" (backdropClose)="onClose()">
  <div class="modal-dialog modal-dialog-centered">
    <div #dialog class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-body d-flex align-items-start gap-3 p-4">
        <span class="modal-icon text-bg-warning">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </span>
        <div>
          <h2 id="session-expired-title" class="modal-title fs-5 fw-bold mb-2">You have been logged out</h2>
          <p class="text-body-secondary mb-0">
            Your session has ended &mdash; you logged out in another tab, or it expired. Nothing can be
            saved until you log in again. Logging in reloads the page, so changes not yet saved in an
            open form will be lost.
          </p>
        </div>
      </div>

      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-link text-decoration-none" (click)="onClose()">Close</button>
        <button type="button" class="btn btn-primary d-flex align-items-center gap-2" (click)="onLogin()">
          <i class="fa-solid fa-right-to-bracket"></i>Log in
        </button>
      </div>
    </div>
  </div>
</div>
