<app-page-header [hideBorder]="true"/>

<div class="error-page">
  <div class="error-content">
    <p class="error-status">{{ status }}</p>
    <h1 class="error-title">{{ text.title }}</h1>
    <p class="error-description">{{ text.description }}</p>
    @if (path) {
      <p class="error-path">Requested address: <code>{{ path }}</code></p>
    }
    <a routerLink="/applications" class="btn btn-primary">
      <i class="fa-solid fa-arrow-left me-1"></i>Back to catalog
    </a>
  </div>
</div>
