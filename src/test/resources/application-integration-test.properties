# Profile of the integration tests (AbstractCatalogIntegrationTest), layered over the main
# application.properties. They run with plain `mvn test` against a PostgreSQL that is already
# running and at the schema version the code requires (DatabaseSchemaVersionValidator).
#
# Point them at your database without editing this file, strongest first:
#   -Dit.db.host=... on the Maven / IDEA command line
#   IT_DB_HOST=... (and friends) as environment variables
#   it-db.local.properties next to pom.xml - gitignored, same keys as below
# The tests write to that database (and clean up after themselves), so never aim them at production.
spring.config.import=optional:file:./it-db.local.properties,optional:file:./integration-catalog/it-db.local.properties

it.db.host=localhost
it.db.port=5432
it.db.name=integrationCatalog
it.db.username=integration_catalog
it.db.password=

spring.datasource.url=jdbc:postgresql://${it.db.host}:${it.db.port}/${it.db.name}
spring.datasource.username=${it.db.username}
spring.datasource.password=${it.db.password}

# Keycloak stub: the OIDC registration points at a provider with fixed endpoints instead of the
# realm's issuer, so nothing ever needs discovery. Tests sign in with oidcLogin(), never through
# these URLs. The Admin API directory is off, maintainers fall back to the catalog's own users.
spring.security.oauth2.client.registration.oidc.provider=integration-test-stub
spring.security.oauth2.client.provider.integration-test-stub.authorization-uri=http://localhost/integration-test-stub/auth
spring.security.oauth2.client.provider.integration-test-stub.token-uri=http://localhost/integration-test-stub/token
spring.security.oauth2.client.provider.integration-test-stub.jwk-set-uri=http://localhost/integration-test-stub/certs
spring.security.oauth2.client.provider.integration-test-stub.user-info-uri=http://localhost/integration-test-stub/userinfo
spring.security.oauth2.client.provider.integration-test-stub.user-name-attribute=preferred_username
catalog.keycloak.directory-enabled=false

# No other external systems either: no support tickets, no retry job ("-" disables the cron).
openproject.enabled=false
pending-operations.cron=-

logo.storage.base-path=./target/integration-test-data/logos
tutorial.storage.base-path=./target/integration-test-data/tutorials
