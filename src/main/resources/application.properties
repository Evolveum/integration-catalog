# Basic auth: the literal "apikey" plus an API token (My account -> Access tokens).
# See openProject/README.md for the token of the local e2e instance.
open-project.api-key=feb909e46775235fa5a6d67970da2413402c74fea459a84a56639845174cc03c
openproject.project=demo-project
#openproject.type=TASK
#openproject.initial-status=NEW
openproject.type-id=1
#openproject.initial-status-id=1
#openproject.approval-statuses=Tested,Closed
