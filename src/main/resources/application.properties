spring.application.name=integration-catalog

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/integrationCatalog
spring.datasource.username=integration_catalog
spring.datasource.password=WJzesbe3poNZ91qIbmR7
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set logging level
logging.level.root=INFO
logging.level.com.example.service=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# GitHub client
github.apiToken=
github.groupPath=
github.templatePath=

# Jenkins client
jenkins.url=
jenkins.username=
jenkins.apiToken=

# server port
server.port=8080

# Surface exception messages (e.g. ResponseStatusException reasons) in error responses.
# Default since Spring Boot 2.3 is "never", which hides the useful upload-conflict details.
server.error.include-message=always

# Logo storage configuration
logo.storage.base-path=./integration-catalog/data/logos
logo.storage.max-size-bytes=5242880

# Tutorial storage configuration
tutorial.storage.base-path=./integration-catalog/data/tutorials
tutorial.storage.max-size-bytes=20971520

# Multipart upload limits (defaults are 1MB/10MB; raise to match tutorial.storage.max-size-bytes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Deployment environment: inStaging | production.
# The frontend shows the staging banner only when this is inStaging.
catalog.environment=inStaging

# Base URL the catalog is reached at from a browser, used to write links into systems that link
# back here - currently the support work package opened when an integration method is submitted.
# The application cannot infer this itself: behind a reverse proxy the request reports whatever the
# proxy forwards, and the work package is written after the submitting request is long gone. Leave
# it empty to write no such links at all.
catalog.public-url=http://localhost:4200

# Support portal (OpenProject) holding the review conversation for a submitted integration
# method. Nothing below appears in the code, so a different instance or target project is a
# change of these values only. Leave openproject.url empty to switch the integration off: no
# work package is created on submission and the reviewer's ticket check is skipped.
openproject.url=http://localhost:8090
# OpenProject does not accept a real login over basic auth. The user name is the literal
# "apikey" and the password is the service account's API token (My account -> Access tokens).
# See openProject/README.md for the token of the local e2e instance.
openproject.username=apikey
openproject.password=feb909e46775235fa5a6d67970da2413402c74fea459a84a56639845174cc03c
# Identifier (or numeric id) of the project the work packages are created in.
openproject.project=demo-project
# Work package type to create; the create call is rejected without one. One of TASK, MILESTONE,
# SUMMARY_TASK, FEATURE, EPIC, USER_STORY, BUG (see OpenProjectType). The type must be enabled in
# the project above, and its workflow decides which statuses the work package can later reach:
# TASK stops at New / In progress / On hold / Rejected / Closed, so it never reaches TESTED, while
# FEATURE, EPIC, USER_STORY and BUG cover the whole testing chain.
openproject.type=TASK
# Status a newly submitted revision's work package is opened with. One of NEW, IN_SPECIFICATION,
# SPECIFIED, CONFIRMED, TO_BE_SCHEDULED, SCHEDULED, IN_PROGRESS, DEVELOPED, IN_TESTING, TESTED,
# TEST_FAILED, CLOSED, ON_HOLD, REJECTED (see OpenProjectStatus).
openproject.initial-status=NEW
# The two constants above carry the ids of a stock OpenProject. A portal numbering its types or
# statuses differently overrides them here; leave both unset otherwise.
#openproject.type-id=
#openproject.initial-status-id=
# Statuses that release the reviewer's "Confirm approval" button - any one of them is enough. Free
# text rather than the constants above, because a portal may carry statuses this catalog does not
# know; either spelling works ("Test failed" and TEST_FAILED are the same status). Every status
# named here has to be reachable in the workflow of openproject.type or nobody can get a work
# package into it.
openproject.approval-statuses=Tested,Closed
# Reviewers to add as watchers of every work package the catalog opens, comma-separated, named by
# portal login. This is the reviewing side only; the submitting side is added automatically, by the
# address in catalog_users.email: the author, plus the maintainer when that is a person. A maintainer
# that is an organization adds nobody of its own - the author submitted on its behalf, and only people
# have an address. Every watcher has to be a member of openproject.project and able to see the work
# package, and looking a user up is an administrative call, so the account behind openproject.username
# needs that privilege. Anyone unknown or not permitted is logged and skipped - the submission and its
# work package stand either way.
openproject.watchers=
# Accept any TLS certificate. Only for the local e2e instance, which is fronted by nginx with a
# self-signed certificate (see openProject/compose-openproject.yml). Never enable in production.
openproject.trust-all-certificates=false

# Signing active connectors
connector.signing.keystore=KEYSTORE_PATH
connector.signing.password=KEYSTORE_PASSWORD
connector.signing.alias=KEY_ALIAS