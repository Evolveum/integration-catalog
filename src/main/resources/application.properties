spring.application.name=integration-catalog

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/integrationCatalog
spring.datasource.username=integration_catalog
spring.datasource.password=WJzesbe3poNZ91qIbmR7
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set logging level
logging.level.root=INFO
com.evolveum.midpoint.integration.catalog=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# GitHub client
github.apiToken=
github.groupPath=
github.templatePath=

# Jenkins client
jenkins.url=
jenkins.username=
jenkins.apiToken=
# Name of the Jenkins job builds are triggered on.
jenkins.jobName=
# Shared secret the Jenkins pipeline sends in the X-Callback-Token header of the
# /api/upload/continue/* callbacks. Callbacks are rejected while this is empty.
jenkins.callbackToken=

# OIDC authentication (this application is the OIDC client)
spring.security.oauth2.client.registration.oidc.client-id=integration-catalog
spring.security.oauth2.client.registration.oidc.client-secret=FCPyoevkTqLJq8vx9N9qbtcMQJFej146
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email,organization
spring.security.oauth2.client.provider.oidc.issuer-uri=http://localhost:8081/realms/integration-catalog
spring.security.oauth2.client.provider.oidc.user-name-attribute=preferred_username

catalog.oidc.claims.roles=roles
catalog.oidc.claims.organization=organization

# server port
server.port=8080

# Surface exception messages (e.g. ResponseStatusException reasons) in error responses.
# Default since Spring Boot 2.3 is "never", which hides the useful upload-conflict details.
server.error.include-message=always

# Logo storage configuration
logo.storage.base-path=./integration-catalog/data/logos
logo.storage.max-size-bytes=5242880

# Tutorial storage configuration
tutorial.storage.base-path=./integration-catalog/data/tutorials
tutorial.storage.max-size-bytes=20971520

# Multipart upload limits (defaults are 1MB/10MB; raise to match tutorial.storage.max-size-bytes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Deployment environment: inStaging | production.
# The frontend shows the staging banner only when this is inStaging.
catalog.environment=inStaging

# URL for catalog in browser
catalog.public-url=http://localhost:4200

# Support portal (OpenProject)
openproject.url=http://localhost:8090
# Basic auth: the literal "apikey" plus an API token (My account -> Access tokens).
# See openProject/README.md for the token of the local e2e instance.
openproject.username=apikey
openproject.password=feb909e46775235fa5a6d67970da2413402c74fea459a84a56639845174cc03c
openproject.project=demo-project
openproject.type=TASK
openproject.initial-status=NEW
#openproject.type-id=
#openproject.initial-status-id=
openproject.approval-statuses=Tested,Closed
openproject.watchers=
# Accept any TLS certificate. Local e2e instance only (self-signed); never enable in production.
openproject.trust-all-certificates=false

# how often to retry - seconds minutes hours day-of-month month day-of-week .
pending-operations.cron=0 0 * * * *
pending-operations.batch-size=100
# attempts before giving up, 0 indefinitely
pending-operations.max-attempts=0

# Signing active connectors
connector.signing.keystore=KEYSTORE_PATH
connector.signing.password=KEYSTORE_PASSWORD
connector.signing.alias=KEY_ALIAS
