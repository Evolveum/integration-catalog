spring.application.name=integration-catalog

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/integrationCatalog
spring.datasource.username=integration_catalog
spring.datasource.password=WJzesbe3poNZ91qIbmR7
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set logging level
logging.level.root=INFO
logging.level.com.example.service=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# GitHub client
github.apiToken=
github.groupPath=
github.templatePath=

# Jenkins client
jenkins.url=
jenkins.username=
jenkins.apiToken=

# server port
server.port=8080

# Surface exception messages (e.g. ResponseStatusException reasons) in error responses.
# Default since Spring Boot 2.3 is "never", which hides the useful upload-conflict details.
server.error.include-message=always

# Logo storage configuration
logo.storage.base-path=./integration-catalog/data/logos
logo.storage.max-size-bytes=5242880

# Tutorial storage configuration
tutorial.storage.base-path=./integration-catalog/data/tutorials
tutorial.storage.max-size-bytes=20971520

# Multipart upload limits (defaults are 1MB/10MB; raise to match tutorial.storage.max-size-bytes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Deployment environment: inStaging | production.
# The frontend shows the staging banner only when this is inStaging.
catalog.environment=inStaging

# Support portal (OpenProject) holding the review conversation for a submitted integration
# method. Nothing below appears in the code, so a different instance or target project is a
# change of these values only. Leave openproject.url empty to switch the integration off: no
# work package is created on submission and the reviewer's ticket check is skipped.
openproject.url=http://localhost:8090
# OpenProject does not accept a real login over basic auth. The user name is the literal
# "apikey" and the password is the service account's API token (My account -> Access tokens).
# See openProject/README.md for the token of the local e2e instance.
openproject.username=apikey
openproject.password=feb909e46775235fa5a6d67970da2413402c74fea459a84a56639845174cc03c
# Identifier (or numeric id) of the project the work packages are created in.
openproject.project=demo-project
# Work package type to create; the create call is rejected without one. 1 is "Task".
openproject.type-id=1
# Status a newly submitted revision's work package is opened with. An id, because creating one
# needs a status link; 1 is "New" in a stock OpenProject.
openproject.initial-status-id=1
# Statuses that release the reviewer's "Confirm approval" button - any one of them is enough.
# Names, because these are matched (ignoring case) against the status title the portal reports.
openproject.approval-statuses=Tested,Closed
# Accept any TLS certificate. Only for the local e2e instance, which is fronted by nginx with a
# self-signed certificate (see openProject/compose-openproject.yml). Never enable in production.
openproject.trust-all-certificates=false

# Signing active connectors
connector.signing.keystore=KEYSTORE_PATH
connector.signing.password=KEYSTORE_PASSWORD
connector.signing.alias=KEY_ALIAS