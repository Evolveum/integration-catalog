# Gravitee API Management, which mints the personal API keys of Settings -> API keys.
# The catalog is one API there with one API-key plan (docker/gravitee/README.md).
#
# gravitee.api[0].id, gravitee.api[0].planId and gravitee.token are declared but left empty: they
# belong to one particular Gravitee, which mints new ones whenever it is rebuilt from empty, and the
# token is a secret that does not belong in a tracked file. Supply them per deployment.
gravitee.managementUrl=http://localhost:8083
gravitee.organizationId=DEFAULT
gravitee.environmentId=DEFAULT
# How long one management call may take; a key is minted while the user waits, so a stalled
# Gravitee has to fail rather than hang
gravitee.timeout=15s
gravitee.api[0].id=
gravitee.api[0].planId=
gravitee.token=

# Support portal (OpenProject)
openproject.enabled=true
openproject.url=http://localhost:8090
# Basic auth: the literal "apikey" plus an API token (My account -> Access tokens).
# See openProject/README.md for the token of the local e2e instance.
openproject.api-key=feb909e46775235fa5a6d67970da2413402c74fea459a84a56639845174cc03c
openproject.project=demo-project
# Work package type to file under; no status is configured, the portal opens it in its own default
openproject.type-id=1
openproject.watchers=
# Accept any TLS certificate. Local e2e instance only (self-signed); never enable in production.
openproject.trust-all-certificates=false
openproject.custom-field[0].id=8
openproject.custom-field[0].value-id=1
# How long one portal call may take; a submission fails fast rather than hang on an unreachable portal
openproject.timeout=15s

# how often to retry - seconds minutes hours day-of-month month day-of-week .
pending-operations.cron=0 0 * * * *
pending-operations.batch-size=100
# attempts before giving up, 0 indefinitely
pending-operations.max-attempts=0

# Signing active connectors
connector.signing.keystore=KEYSTORE_PATH
connector.signing.password=KEYSTORE_PASSWORD
connector.signing.alias=KEY_ALIAS

# Health checks for the Kubernetes probes: /actuator/health/liveness and /actuator/health/readiness.
# Only "health" is exposed. Readiness also checks the DB; liveness doesn't, so a DB outage takes
# the pod out of the Service instead of restarting it.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
