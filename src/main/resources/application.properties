# Gravitee API Management, which mints the personal API keys of Settings -> API keys.
# The catalog is one API there with one API-key plan (docker/gravitee/README.md).
#
# TODO change comment -> all properties need in this properties file
# gravitee.apiId, gravitee.planId and gravitee.token are deliberately NOT set here: they belong to
# one particular Gravitee, which mints new ones every time it is rebuilt from empty, and the token
# is a secret. docker/gravitee/seed.sh writes all three to ./gravitee-local.properties, which is
# gitignored and imported below - so a re-seed needs no edit of this file. They are left undeclared
# rather than empty so the imported file is the only place they come from. Until it exists, key
# creation answers 503 with a clear message and the rest of the catalog is unaffected.
gravitee.managementUrl=http://localhost:8083
gravitee.organizationId=DEFAULT
gravitee.environmentId=DEFAULT
gravitee.api[0].id=
gravitee.api[0].planId=
gravitee.token=

