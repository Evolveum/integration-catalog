spring.application.name=integration-catalog

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/integrationCatalog
spring.datasource.username=integration_catalog
spring.datasource.password=WJzesbe3poNZ91qIbmR7
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration file (Logback). Levels/appenders/patterns live in log4j.xml.
logging.config=classpath:log4j.xml

# Render the startup banner (banner.txt) through the logging system instead of
# straight to stdout, so it is written at the top of the log file. It still shows
# in the terminal too, because the console appender is attached during startup.
spring.main.banner-mode=log

# GitHub client
github.apiToken=
github.groupPath=
github.templatePath=

# Jenkins client
jenkins.url=
jenkins.username=
jenkins.apiToken=
# Name of the Jenkins job builds are triggered on.
jenkins.jobName=
# Shared secret the Jenkins pipeline sends in the X-Callback-Token header of the
# /api/upload/continue/* callbacks. Callbacks are rejected while this is empty.
jenkins.callbackToken=

# OIDC authentication (this application is the OIDC client)
spring.security.oauth2.client.registration.oidc.client-id=integration-catalog
spring.security.oauth2.client.registration.oidc.client-secret=FCPyoevkTqLJq8vx9N9qbtcMQJFej146
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email,organization
spring.security.oauth2.client.provider.oidc.issuer-uri=http://localhost:8081/realms/integration-catalog
spring.security.oauth2.client.provider.oidc.user-name-attribute=preferred_username

catalog.oidc.claims.roles=roles
catalog.oidc.claims.organization=organization

# Read the realm's users through the Keycloak Admin API, so a superuser can name a maintainer who
# has not published anything yet. Uses the client-credentials grant of the client above, whose
# service account needs the realm-management/view-users role. Set to false where that service
# account is not enabled: the maintainer list then falls back to the users the catalog itself
# knows, which is also what happens whenever Keycloak cannot be reached.
catalog.keycloak.directory-enabled=true

# Timeouts for those Admin API calls. Short on purpose: an unreachable Keycloak must cost the
# maintainer list its Keycloak half, not hang the request that asked for it.
catalog.keycloak.connect-timeout=2s
catalog.keycloak.read-timeout=5s

# Timeouts when fetching a connector artifact from Nexus into a download bundle: connecting, and
# the whole response (an artifact can be large)
catalog.bundle-download.connect-timeout=15s
catalog.bundle-download.read-timeout=60s

# server port
server.port=8080

# Surface exception messages (e.g. ResponseStatusException reasons) in error responses.
# Default since Spring Boot 2.3 is "never", which hides the useful upload-conflict details.
server.error.include-message=always

# Logo storage configuration
logo.storage.base-path=./integration-catalog/data/logos
logo.storage.max-size-bytes=5242880

# Tutorial storage configuration
tutorial.storage.base-path=./integration-catalog/data/tutorials
tutorial.storage.max-size-bytes=20971520

# Multipart upload limits (defaults are 1MB/10MB; raise to match tutorial.storage.max-size-bytes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Deployment environment: inStaging | production.
# The frontend shows the staging banner only when this is inStaging.
catalog.environment=inStaging

#Disable Swagger UI and OpenAPI documentation for security reasons
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# URL for catalog in browser
catalog.public-url=http://localhost:4200

# External documents linked from the frontend (served by GET /api/links).
# Change a link here - or override it, e.g. CATALOG_LINKS_TERMS_OF_USE - no code change needed.
