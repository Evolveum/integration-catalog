spring.application.name=integration-catalog

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/integrationCatalog
spring.datasource.username=integration_catalog
spring.datasource.password=WJzesbe3poNZ91qIbmR7
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set logging level
logging.level.root=INFO
logging.level.com.example.service=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# GitHub client
github.apiToken=
github.groupPath=
github.templatePath=

# Jenkins client
jenkins.url=
jenkins.username=
jenkins.apiToken=
# Shared secret the Jenkins pipeline sends in the X-Callback-Token header of the
# /api/upload/continue/* callbacks. Callbacks are rejected while this is empty.
jenkins.callbackToken=

# OIDC authentication (Keycloak is the identity provider; this application is the OIDC client)
spring.security.oauth2.client.registration.keycloak.client-id=integration-catalog
spring.security.oauth2.client.registration.keycloak.client-secret=FCPyoevkTqLJq8vx9N9qbtcMQJFej146
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/integration-catalog
# The principal name (Authentication.getName()) is the Keycloak username, not the opaque "sub".
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# server port
server.port=8080

# Surface exception messages (e.g. ResponseStatusException reasons) in error responses.
# Default since Spring Boot 2.3 is "never", which hides the useful upload-conflict details.
server.error.include-message=always

# Logo storage configuration
logo.storage.base-path=./integration-catalog/data/logos
logo.storage.max-size-bytes=5242880

# Tutorial storage configuration
tutorial.storage.base-path=./integration-catalog/data/tutorials
tutorial.storage.max-size-bytes=20971520

# Multipart upload limits (defaults are 1MB/10MB; raise to match tutorial.storage.max-size-bytes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Signing active connectors
signing.keystore=KEYSTORE_PATH
signing.password=KEYSTORE_PASSWORD
signing.alias=KEY_ALIAS