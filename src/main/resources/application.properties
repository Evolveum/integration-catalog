# how often to retry - seconds minutes hours day-of-month month day-of-week .
pending-operations.cron=0 0 * * * *
pending-operations.batch-size=100
# attempts before giving up, 0 indefinitely
pending-operations.max-attempts=0

# Signing active connectors
connector.signing.keystore=KEYSTORE_PATH
connector.signing.password=KEYSTORE_PASSWORD
connector.signing.alias=KEY_ALIAS

# Health checks for the Kubernetes probes: /actuator/health/liveness and /actuator/health/readiness.
# Only "health" is exposed. Readiness also checks the DB; liveness doesn't, so a DB outage takes
# the pod out of the Service instead of restarting it.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
