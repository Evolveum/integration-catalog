# A complete throwaway environment for the GUI tests: Docker starts and initializes it, Maven then
# runs the tests from outside against it. From the repository root:
#
#   docker compose -f gui-tests/compose.yml up -d --build --wait
#   mvn -f gui-tests/pom.xml test -Pdocker
#   docker compose -f gui-tests/compose.yml down -v
#
# The catalog database holds only the schema and its reference data; the tests create everything
# else through the UI. "down -v" throws the stack away, databases included, so every run starts
# from an empty catalog.
#
# Ports 18080 (catalog), 18081 (Keycloak) and 18090 (OpenProject) leave the usual development ports
# free, so the stack can run next to a developer's local services. The catalog shares Keycloak's
# network namespace and listens on the same port inside as outside: the browser and the backend
# then reach Keycloak by the same URL, which OIDC requires, and every browser-facing URL is
# localhost, where the catalog's secure cookies work over plain HTTP.

name: ic-gui-tests

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "18080:18080"   # the catalog, which runs in this network namespace
      - "18081:18081"
    environment:
      KC_HTTP_PORT: "18081"
      KC_HOSTNAME: http://localhost:18081
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # The local development realm: users u1-u5 (password = user name), its organizations and
      # the catalog client whose secret application.properties already carries.
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; bash talks to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: integrationCatalog
      POSTGRES_USER: integration_catalog
      POSTGRES_PASSWORD: integration_catalog
    volumes:
      # Schema and reference data only; the tests create everything else they need.
      - ../config/sql/postgres.sql:/docker-entrypoint-initdb.d/postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_catalog -d integrationCatalog"]
      interval: 5s
      timeout: 5s
      retries: 30

  catalog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: service:keycloak
    environment:
      SERVER_PORT: "18080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/integrationCatalog
      SPRING_DATASOURCE_USERNAME: integration_catalog
      SPRING_DATASOURCE_PASSWORD: integration_catalog
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUERURI: http://localhost:18081/realms/integration-catalog
      CATALOG_LINKS_IAMPROFILEURL: http://localhost:18081/realms/integration-catalog/account
      # The SPA is served by the backend itself here, not by ng serve on :4200.
      CATALOG_PUBLICURL: http://localhost:18080
      OPENPROJECT_URL: http://openproject
      GRAVITEE_MANAGEMENTURL: http://gravitee-management:8083
      # The API and plan ids and the token, written by gravitee-seed; overrides the empty defaults.
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/gravitee/gravitee.properties
    volumes:
      - gravitee-seed:/gravitee:ro
    depends_on:
      keycloak:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
      gravitee-seed:
        condition: service_completed_successfully
      openproject:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The support portal, from the same seed as openProject/compose-openproject.yml: its project,
  # custom field and the API key application.properties carries. The tests close review tickets
  # through its REST API on port 18090.
  openproject-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject
      POSTGRES_DB: openproject
    volumes:
      - ./docker/openproject/seed.sql.gz:/docker-entrypoint-initdb.d/seed.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject"]
      interval: 5s
      timeout: 5s
      retries: 30

  openproject:
    image: openproject/openproject:17
    ports:
      - "18090:80"
    environment:
      OPENPROJECT_HOST__NAME: localhost:18090
      # The catalog calls it by its service name.
      OPENPROJECT_ADDITIONAL__HOST__NAMES: openproject
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_SECRET_KEY_BASE: gui-tests-only
      OPENPROJECT_DISABLE__SECRET_KEY_BASE__CHECK: "true"
      DATABASE_URL: postgres://openproject:openproject@openproject-db/openproject
    depends_on:
      openproject-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health_checks/default"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Gravitee APIM for Settings -> API keys: only what the management API needs. The gateway and
  # the console of docker/gravitee/docker-compose.yaml are left out - nothing calls them.
  gravitee-mongodb:
    image: mongo:6.0
    healthcheck:
      test: mongosh --eval 'db.runCommand({serverStatus:1}).ok' --quiet | grep 1
      interval: 5s
      timeout: 3s
      retries: 20

  gravitee-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    environment:
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s']
      interval: 5s
      timeout: 3s
      retries: 30

  gravitee-management:
    image: graviteeio/apim-management-api:4.8
    environment:
      - gravitee_management_mongodb_uri=mongodb://gravitee-mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
      - gravitee_analytics_elasticsearch_endpoints_0=http://gravitee-elasticsearch:9200
    depends_on:
      gravitee-mongodb:
        condition: service_healthy
      gravitee-elasticsearch:
        condition: service_healthy

  # Creates the API and its plan, enables shared API keys and mints a token (docker/gravitee/seed.sh,
  # which waits for the management API itself), writing them where the catalog reads them.
  gravitee-seed:
    image: python:3.13-alpine
    entrypoint: ["sh", "-c", "apk add --no-cache --quiet bash curl && exec bash /seed/seed.sh"]
    environment:
      GRAVITEE_URL: http://gravitee-management:8083
      OUTPUT_FILE: /gravitee/gravitee.properties
    volumes:
      - ../docker/gravitee/seed.sh:/seed/seed.sh:ro
      - gravitee-seed:/gravitee
    depends_on:
      - gravitee-management

volumes:
  gravitee-seed:
